name: Deploy Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      command:
        description: "OpenTofu command"
        required: true
        type: choice
        options:
          - plan
          - apply
concurrency:
  group: opentofu-demo
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
## not needed for github actions, it was used in bootstrap #### 
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_bootstrap_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_online_subscription_id: ${{ secrets.ONLINE_SUBSCRIPTION_ID }}
  TF_VAR_connectivity_subscription_id: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
  TF_VAR_sandbox_subscription_id: ${{ secrets.SANDBOX_SUBSCRIPTION_ID }}


jobs:
  opentofu:
    runs-on: ubuntu-latest
    environment: demo

    defaults:
      run:
        working-directory: environments/demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: OpenTofu Init
        run: tofu init -input=false

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Validate
        run: tofu validate

      - name: OpenTofu Plan
        run: tofu plan -input=false -out=tfplan 

      - name: OpenTofu Apply
        if: ${{ inputs.command == 'apply' }}
        run: tofu apply -auto-approve tfplan
